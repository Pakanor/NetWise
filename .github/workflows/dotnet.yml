name: .NET

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CatFactFetcher.sln

      - name: Build solution
        run: dotnet build CatFactFetcher.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CatFactFetcher.sln --configuration Release --no-build